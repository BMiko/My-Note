<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Cottage Workspace</title>
  
  <!-- เชื่อมโยง Manifest เพื่อให้ Android ติดตั้งเป็นแอปเต็มจอ -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#663366">
  
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/869/869869.png">

  <!-- Tailwind CSS & ฟอนต์ Mitr -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Mitr:wght@300;400;500;600&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            cottagePink: '#ef9dc1',
            cottagePlum: '#663366',
            cottagePaper: '#fafafa',
            cottageSlate: '#5b5a58',
            cottageBark: '#1c0e07',
          }
        }
      }
    }
  </script>

  <style>
    body { font-family: 'Mitr', sans-serif; background-color: #fafafa; }
    [contenteditable]:empty:before {
      content: attr(data-placeholder);
      color: #5b5a58;
      opacity: 0.4;
    }
    .notion-block:focus { outline: none; }
    /* ซ่อน scrollbar แถบเครื่องมือ */
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="h-screen w-screen flex overflow-hidden text-cottageBark select-none">

  <!-- ม่านดำเวลาเปิด Sidebar บนมือถือ -->
  <div id="sidebarOverlay" class="fixed inset-0 bg-black/40 z-40 hidden transition-opacity" onclick="toggleSidebar()"></div>

  <!-- แถบด้านข้าง (Sidebar แบบ Drawer เลื่อนเก็บได้ ไม่บังหน้าจอ) -->
  <aside id="sidebar" class="fixed inset-y-0 left-0 w-72 bg-white/95 backdrop-blur-md border-r border-cottageSlate/15 flex flex-col transition-transform duration-300 z-50 -translate-x-full">
    <!-- Header Sidebar -->
    <div class="p-4 border-b border-cottageSlate/10 flex items-center justify-between">
      <div class="flex items-center gap-2">
        <span class="text-2xl">🧺</span>
        <div>
          <h2 class="font-semibold text-cottagePlum text-sm">Cottage Workspace</h2>
          <span class="text-[10px] text-cottagePink font-medium">Android Edition</span>
        </div>
      </div>
      <button onclick="toggleSidebar()" class="text-cottageSlate p-2 text-lg">✕</button>
    </div>

    <!-- สลับโหมด เอกสาร / ฐานข้อมูล -->
    <div class="p-3">
      <div class="grid grid-cols-2 gap-1 bg-cottageSlate/10 p-1 rounded-xl text-xs font-medium text-center">
        <button id="tabPagesBtn" onclick="switchMainView('pages')" class="py-1.5 rounded-lg bg-white text-cottagePlum shadow-sm">📚 สมุดโน้ต</button>
        <button id="tabDbBtn" onclick="switchMainView('database')" class="py-1.5 rounded-lg text-cottageSlate">📊 ฐานข้อมูล</button>
      </div>
    </div>

    <!-- ปุ่มสร้างโฟลเดอร์ & หน้า -->
    <div class="px-3 grid grid-cols-2 gap-2 mb-2" id="actionButtons">
      <button onclick="createNewFolder()" class="bg-stone-100 active:bg-stone-200 text-cottageBark font-medium text-xs py-2 px-2 rounded-xl flex items-center justify-center gap-1">
        📁 โฟลเดอร์
      </button>
      <button onclick="createNewPage(null)" class="bg-cottagePink/25 active:bg-cottagePink/35 text-cottagePlum font-medium text-xs py-2 px-2 rounded-xl flex items-center justify-center gap-1">
        + หน้าใหม่
      </button>
    </div>

    <!-- รายการโฟลเดอร์และหน้าเอกสาร -->
    <div class="flex-1 overflow-y-auto px-3 space-y-2" id="sidebarTree"></div>

    <!-- สำรองข้อมูล -->
    <div class="p-3 border-t border-cottageSlate/10 text-xs bg-stone-50/70 space-y-2">
      <div class="flex justify-between items-center text-[11px] text-cottageSlate font-semibold">
        <span>💾 สำรองข้อมูล (Pro)</span>
      </div>
      <div class="grid grid-cols-2 gap-2">
        <button onclick="exportData()" class="bg-white border border-cottageSlate/20 p-2 rounded-lg text-center font-medium active:bg-stone-100">ดาวน์โหลด</button>
        <label class="bg-white border border-cottageSlate/20 p-2 rounded-lg text-center font-medium active:bg-stone-100 cursor-pointer">
          กู้คืน
          <input type="file" onchange="importData(event)" class="hidden" accept=".json">
        </label>
      </div>
    </div>
  </aside>

  <!-- พื้นที่ทำงานหลัก (เต็มจอมือถือ) -->
  <main class="flex-1 flex flex-col h-full w-full overflow-hidden bg-cottagePaper relative">
    
    <!-- Top Bar (ออกแบบให้เลื่อนแนวนอนได้ ไม่ล้นจอ) -->
    <header class="h-12 border-b border-cottageSlate/10 flex items-center justify-between px-3 bg-white/70 backdrop-blur-sm z-10 shrink-0">
      <button onclick="toggleSidebar()" class="p-2 rounded-lg text-cottagePlum shrink-0 active:bg-black/5">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/></svg>
      </button>

      <!-- เครื่องมือบล็อก (เลื่อนซ้าย-ขวาได้ ปุ่มไม่ตกขอบ) -->
      <div id="editorToolbar" class="flex items-center gap-1.5 overflow-x-auto no-scrollbar py-1 px-2 text-xs shrink">
        <button onclick="insertBlock('h1')" class="px-2.5 py-1 bg-stone-100 active:bg-cottagePink/20 rounded-lg font-bold shrink-0">H1</button>
        <button onclick="insertBlock('todo')" class="px-2.5 py-1 bg-stone-100 active:bg-cottagePink/20 rounded-lg shrink-0">☑ To-do</button>
        <button onclick="insertBlock('callout')" class="px-2.5 py-1 bg-stone-100 active:bg-cottagePink/20 rounded-lg shrink-0">💡 กล่องเน้น</button>
        <button onclick="insertBlock('toggle')" class="px-2.5 py-1 bg-stone-100 active:bg-cottagePink/20 rounded-lg shrink-0">▶ ย่อขยาย</button>
        <button onclick="deleteCurrentPage()" class="px-2.5 py-1 text-red-500 bg-red-50 active:bg-red-100 rounded-lg shrink-0">ลบ</button>
      </div>

      <!-- สลับมุมมอง Database -->
      <div id="databaseToolbar" class="hidden flex items-center gap-1 text-xs">
        <button onclick="setDbView('table')" id="btnViewTable" class="px-2.5 py-1 rounded-lg bg-cottagePlum text-white font-medium">📋 ตาราง</button>
        <button onclick="setDbView('board')" id="btnViewBoard" class="px-2.5 py-1 rounded-lg bg-white border border-cottageSlate/20 text-cottageSlate font-medium">📌 บอร์ด</button>
      </div>
    </header>

    <!-- พื้นที่หน้าเอกสาร (Page View) -->
    <div id="pageViewArea" class="flex-1 overflow-y-auto select-text">
      
      <!-- ภาพปก Cover -->
      <div id="pageCover" class="h-36 w-full bg-cover bg-center relative" style="background-image: url('https://images.unsplash.com/photo-1518531933037-91b2f5f229cc?q=80&w=1200&auto=format&fit=crop');">
        <div class="absolute inset-0 bg-cottagePlum/10"></div>
        <label class="absolute right-3 bottom-3 bg-white/90 active:bg-white text-cottageBark text-[11px] px-2.5 py-1.5 rounded-xl shadow cursor-pointer flex items-center gap-1">
          <span>🖼️ เปลี่ยนปก</span>
          <input type="file" accept="image/*" class="hidden" onchange="uploadCoverImage(event)">
        </label>
      </div>

      <!-- เนื้อหาภายในหน้า -->
      <div class="px-4 -mt-8 relative pb-24 max-w-2xl mx-auto">
        
        <!-- ไอคอนประจำหน้า -->
        <div class="relative inline-block mb-3">
          <div id="pageIconBox" class="w-14 h-14 bg-white rounded-2xl shadow-md border border-cottageSlate/15 flex items-center justify-center overflow-hidden"></div>
          <div class="absolute -bottom-1 -right-1 flex gap-1">
            <label title="อัปโหลดรูป" class="bg-white p-1 rounded-full shadow border border-cottageSlate/20 cursor-pointer text-xs">
              📸
              <input type="file" accept="image/*" class="hidden" onchange="uploadIconImage(event)">
            </label>
            <button onclick="cyclePageEmoji()" title="เปลี่ยนอิโมจิ" class="bg-white p-1 rounded-full shadow border border-cottageSlate/20 text-xs">
              🌸
            </button>
          </div>
        </div>

        <!-- หัวข้อหน้าเอกสาร -->
        <input id="pageTitleInput" type="text" placeholder="ไม่มีชื่อหน้า..." 
               class="w-full text-2xl font-semibold bg-transparent outline-none text-cottageBark placeholder-cottageSlate/30 mb-4"
               oninput="onPageTitleChange()">

        <!-- กล่องใส่บล็อกเนื้อหา -->
        <div id="blocksContainer" class="space-y-3 min-h-[350px]"></div>
      </div>
    </div>

    <!-- พื้นที่ฐานข้อมูล (Database View) -->
    <div id="databaseViewArea" class="hidden flex-1 overflow-y-auto p-4 select-text">
      <div class="flex justify-between items-center mb-4">
        <div>
          <h1 class="text-lg font-bold text-cottagePlum">ฐานข้อมูลงาน & โปรเจกต์</h1>
        </div>
        <button onclick="addNewDbRow()" class="bg-cottagePlum text-white text-xs px-3 py-1.5 rounded-xl font-medium shadow">+ รายการ</button>
      </div>

      <!-- Table View -->
      <div id="dbTableView" class="bg-white rounded-xl border border-cottageSlate/15 shadow-sm overflow-x-auto">
        <table class="w-full text-left text-xs min-w-[320px]">
          <thead class="bg-stone-50 border-b border-cottageSlate/10 text-cottageSlate">
            <tr>
              <th class="p-2.5">ชื่องาน</th>
              <th class="p-2.5">สถานะ</th>
              <th class="p-2.5">สำคัญ</th>
              <th class="p-2.5 text-center">ลบ</th>
            </tr>
          </thead>
          <tbody id="dbTableBody" class="divide-y divide-cottageSlate/10"></tbody>
        </table>
      </div>

      <!-- Kanban View -->
      <div id="dbBoardView" class="hidden space-y-4">
        <div class="bg-stone-100 p-3 rounded-xl">
          <div class="font-semibold text-xs text-cottageSlate mb-2">⭕ ยังไม่เริ่ม (<span id="count-todo">0</span>)</div>
          <div id="board-todo" class="space-y-2"></div>
        </div>
        <div class="bg-[#fcedf2] p-3 rounded-xl">
          <div class="font-semibold text-xs text-cottagePlum mb-2">⏳ กำลังทำ (<span id="count-progress">0</span>)</div>
          <div id="board-progress" class="space-y-2"></div>
        </div>
        <div class="bg-emerald-50 p-3 rounded-xl">
          <div class="font-semibold text-xs text-emerald-800 mb-2">✅ เสร็จแล้ว (<span id="count-done">0</span>)</div>
          <div id="board-done" class="space-y-2"></div>
        </div>
      </div>
    </div>
  </main>

  <script>
    // ลงทะเบียน Service Worker เพื่อให้ Android ยอมรับเป็นแอป
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').catch(() => {});
      });
    }

    let folders = JSON.parse(localStorage.getItem('cottage_folders') || '[]');
    let pages = JSON.parse(localStorage.getItem('cottage_notion_pages') || '[]');
    let dbItems = JSON.parse(localStorage.getItem('cottage_notion_db') || '[]');
    let currentPageId = null;
    let currentDbView = 'table';
    const DEFAULT_COVER = 'https://images.unsplash.com/photo-1518531933037-91b2f5f229cc?q=80&w=1200&auto=format&fit=crop';

    window.onload = function() {
      initApp();
    };

    function initApp() {
      if (folders.length === 0) {
        folders = [
          { id: 'f1', name: 'ความรู้และไอเดีย', emoji: '📚' },
          { id: 'f2', name: 'ไดอารี่ประจำวัน', emoji: '🏡' }
        ];
        saveFolders();
      }

      if (pages.length === 0) {
        pages.push({
          id: Date.now().toString(),
          folderId: 'f1',
          iconType: 'emoji',
          iconVal: '🌿',
          coverUrl: DEFAULT_COVER,
          title: 'ยินดีต้อนรับสู่ Cottage Workspace',
          blocks: [
            { type: 'callout', content: 'เวอร์ชันนี้จัดตำแหน่งให้พอดีกับจอมือถือ Android และรองรับการเปิดแบบแอปเต็มจอแล้วค่ะ! 🌸' },
            { type: 'h1', content: 'การใช้งานบนมือถือ' },
            { type: 'todo', content: 'กดปุ่มเมนู ☰ ที่มุมซ้ายบนเพื่อดูโฟลเดอร์', checked: false },
            { type: 'todo', content: 'แถบเครื่องมือด้านบนเลื่อนซ้าย-ขวาได้', checked: false }
          ]
        });
        savePages();
      }

      if (dbItems.length === 0) {
        dbItems = [
          { id: '1', title: 'แต่งหน้าร้านจัดสวน', status: 'In Progress', priority: 'สูง 🌸' },
          { id: '2', title: 'จิบชายามบ่าย', status: 'To Do', priority: 'ปานกลาง ☕' }
        ];
        saveDb();
      }

      renderSidebarTree();
      selectPage(pages[0].id);
      renderDatabase();
    }

    function toggleSidebar() {
      const sidebar = document.getElementById('sidebar');
      const overlay = document.getElementById('sidebarOverlay');
      const isOpen = !sidebar.classList.contains('-translate-x-full');
      if (isOpen) {
        sidebar.classList.add('-translate-x-full');
        overlay.classList.add('hidden');
      } else {
        sidebar.classList.remove('-translate-x-full');
        overlay.classList.remove('hidden');
      }
    }

    function switchMainView(view) {
      if (view === 'pages') {
        document.getElementById('pageViewArea').classList.remove('hidden');
        document.getElementById('databaseViewArea').classList.add('hidden');
        document.getElementById('editorToolbar').classList.remove('hidden');
        document.getElementById('databaseToolbar').classList.add('hidden');
        document.getElementById('tabPagesBtn').className = 'py-1.5 rounded-lg bg-white text-cottagePlum shadow-sm';
        document.getElementById('tabDbBtn').className = 'py-1.5 rounded-lg text-cottageSlate';
        document.getElementById('actionButtons').classList.remove('hidden');
      } else {
        document.getElementById('pageViewArea').classList.add('hidden');
        document.getElementById('databaseViewArea').classList.remove('hidden');
        document.getElementById('editorToolbar').classList.add('hidden');
        document.getElementById('databaseToolbar').classList.remove('hidden');
        document.getElementById('tabDbBtn').className = 'py-1.5 rounded-lg bg-white text-cottagePlum shadow-sm';
        document.getElementById('tabPagesBtn').className = 'py-1.5 rounded-lg text-cottageSlate';
        document.getElementById('actionButtons').classList.add('hidden');
        renderDatabase();
      }
      toggleSidebar();
    }

    function saveFolders() { localStorage.setItem('cottage_folders', JSON.stringify(folders)); }
    function savePages() { localStorage.setItem('cottage_notion_pages', JSON.stringify(pages)); }
    function saveDb() { localStorage.setItem('cottage_notion_db', JSON.stringify(dbItems)); }

    function createNewFolder() {
      const name = prompt('ชื่อโฟลเดอร์:');
      if (!name) return;
      folders.push({ id: 'f_' + Date.now(), name: name, emoji: '📁' });
      saveFolders();
      renderSidebarTree();
    }

    function deleteFolder(fId, e) {
      e.stopPropagation();
      if (confirm('ต้องการลบโฟลเดอร์นี้หรือไม่?')) {
        folders = folders.filter(f => f.id !== fId);
        pages.forEach(p => { if (p.folderId === fId) p.folderId = null; });
        saveFolders();
        savePages();
        renderSidebarTree();
      }
    }

    function createNewPage(folderId = null) {
      const newPage = {
        id: Date.now().toString(),
        folderId: folderId,
        iconType: 'emoji',
        iconVal: '🌸',
        coverUrl: DEFAULT_COVER,
        title: '',
        blocks: [{ type: 'text', content: '' }]
      };
      pages.unshift(newPage);
      savePages();
      renderSidebarTree();
      selectPage(newPage.id);
      toggleSidebar();
      document.getElementById('pageTitleInput').focus();
    }

    function renderSidebarTree() {
      const tree = document.getElementById('sidebarTree');
      let html = '';

      folders.forEach(f => {
        const folderPages = pages.filter(p => p.folderId === f.id);
        html += `
          <div class="mb-1">
            <div class="flex items-center justify-between p-2 rounded-xl text-xs font-medium text-cottageBark active:bg-black/5">
              <div class="flex items-center gap-1.5 truncate">
                <span>${f.emoji}</span>
                <span class="truncate">${f.name}</span>
                <span class="text-[10px] text-cottageSlate">(${folderPages.length})</span>
              </div>
              <div class="flex items-center gap-2">
                <button onclick="createNewPage('${f.id}')" class="text-cottagePlum font-bold px-1.5 bg-stone-100 rounded">+</button>
                <button onclick="deleteFolder('${f.id}', event)" class="text-red-400 px-1">✕</button>
              </div>
            </div>
            <div class="pl-4 space-y-0.5 mt-0.5 border-l border-cottageSlate/15 ml-3">
              ${folderPages.map(p => renderPageItem(p)).join('')}
            </div>
          </div>
        `;
      });

      const unfiled = pages.filter(p => !p.folderId);
      if (unfiled.length > 0) {
        html += `
          <div class="pt-2 border-t border-cottageSlate/10">
            <div class="text-[10px] uppercase font-bold text-cottageSlate/70 px-2 mb-1">หน้าทั่วไป</div>
            <div class="space-y-0.5">
              ${unfiled.map(p => renderPageItem(p)).join('')}
            </div>
          </div>
        `;
      }
      tree.innerHTML = html;
    }

    function renderPageItem(p) {
      const iconDisplay = p.iconType === 'image' 
        ? `<img src="${p.iconVal}" class="w-3.5 h-3.5 rounded object-cover">` 
        : `<span>${p.iconVal || '📄'}</span>`;

      return `
        <div onclick="selectPage('${p.id}'); toggleSidebar();" 
             class="flex items-center gap-2 p-1.5 rounded-lg text-xs ${p.id === currentPageId ? 'bg-cottagePlum/10 font-semibold text-cottagePlum' : 'text-cottageBark active:bg-black/5'}">
          ${iconDisplay}
          <span class="truncate">${p.title || 'ไม่มีชื่อหน้า'}</span>
        </div>
      `;
    }

    function selectPage(id) {
      currentPageId = id;
      const page = pages.find(p => p.id === id);
      if (!page) return;

      document.getElementById('pageCover').style.backgroundImage = `url('${page.coverUrl || DEFAULT_COVER}')`;
      renderPageIconUI(page);
      document.getElementById('pageTitleInput').value = page.title;

      renderBlocks();
      renderSidebarTree();
    }

    function renderPageIconUI(page) {
      const box = document.getElementById('pageIconBox');
      if (page.iconType === 'image') {
        box.innerHTML = `<img src="${page.iconVal}" class="w-full h-full object-cover">`;
      } else {
        box.innerHTML = `<span class="text-2xl">${page.iconVal || '🌸'}</span>`;
      }
    }

    function compressAndReadImage(file, maxWidth, maxHeight, quality, callback) {
      const reader = new FileReader();
      reader.onload = function(e) {
        const img = new Image();
        img.onload = function() {
          const canvas = document.createElement('canvas');
          let width = img.width;
          let height = img.height;
          if (width > maxWidth) { height = Math.round((height * maxWidth) / width); width = maxWidth; }
          if (height > maxHeight) { width = Math.round((width * maxHeight) / height); height = maxHeight; }
          canvas.width = width; canvas.height = height;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, width, height);
          callback(canvas.toDataURL('image/jpeg', quality));
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    }

    function uploadCoverImage(e) {
      const file = e.target.files[0];
      if (!file) return;
      compressAndReadImage(file, 1000, 600, 0.7, function(base64) {
        const page = pages.find(p => p.id === currentPageId);
        if (page) {
          page.coverUrl = base64;
          savePages();
          document.getElementById('pageCover').style.backgroundImage = `url('${base64}')`;
        }
      });
    }

    function uploadIconImage(e) {
      const file = e.target.files[0];
      if (!file) return;
      compressAndReadImage(file, 150, 150, 0.8, function(base64) {
        const page = pages.find(p => p.id === currentPageId);
        if (page) {
          page.iconType = 'image';
          page.iconVal = base64;
          savePages();
          renderPageIconUI(page);
          renderSidebarTree();
        }
      });
    }

    function cyclePageEmoji() {
      const emojis = ['🌸', '🌿', '🍄', '🧺', '📖', '☕', '🍰', '🕊️', '🍂', '✨'];
      const page = pages.find(p => p.id === currentPageId);
      if (page) {
        page.iconType = 'emoji';
        const currentIndex = emojis.indexOf(page.iconVal);
        page.iconVal = emojis[(currentIndex + 1) % emojis.length];
        savePages();
        renderPageIconUI(page);
        renderSidebarTree();
      }
    }

    function onPageTitleChange() {
      const page = pages.find(p => p.id === currentPageId);
      if (page) {
        page.title = document.getElementById('pageTitleInput').value;
        savePages();
        renderSidebarTree();
      }
    }

    function renderBlocks() {
      const page = pages.find(p => p.id === currentPageId);
      const container = document.getElementById('blocksContainer');
      if (!page) return;

      container.innerHTML = page.blocks.map((block, index) => {
        if (block.type === 'h1') {
          return `<div contenteditable="true" oninput="updateBlock(${index}, this.innerText)" class="notion-block text-xl font-semibold text-cottagePlum mt-3 border-b border-cottageSlate/10 pb-1" data-placeholder="หัวข้อใหญ่...">${block.content}</div>`;
        } else if (block.type === 'todo') {
          return `
            <div class="flex items-start gap-2.5 my-1">
              <input type="checkbox" ${block.checked ? 'checked' : ''} onchange="toggleTodo(${index}, this.checked)" class="mt-1 accent-[#663366] w-4 h-4 rounded">
              <div contenteditable="true" oninput="updateBlock(${index}, this.innerText)" class="notion-block flex-1 text-sm ${block.checked ? 'line-through opacity-50' : ''}" data-placeholder="สิ่งที่ต้องทำ...">${block.content}</div>
            </div>`;
        } else if (block.type === 'callout') {
          return `
            <div class="bg-cottagePink/15 border-l-4 border-cottagePink p-3 rounded-r-xl flex items-start gap-2.5 my-2">
              <span class="text-sm">💡</span>
              <div contenteditable="true" oninput="updateBlock(${index}, this.innerText)" class="notion-block flex-1 text-xs leading-relaxed" data-placeholder="ข้อความเน้น...">${block.content}</div>
            </div>`;
        } else if (block.type === 'toggle') {
          return `
            <details class="bg-stone-50 border border-cottageSlate/15 p-2.5 rounded-xl my-2">
              <summary contenteditable="true" oninput="updateToggleSummary(${index}, this.innerText)" class="notion-block cursor-pointer font-medium text-xs text-cottagePlum outline-none">${block.summary}</summary>
              <div contenteditable="true" oninput="updateBlock(${index}, this.innerText)" class="notion-block mt-2 pl-3 text-xs border-l border-cottagePink/40" data-placeholder="เนื้อหาที่ซ่อน...">${block.content}</div>
            </details>`;
        } else {
          return `<div contenteditable="true" oninput="updateBlock(${index}, this.innerText)" class="notion-block text-sm leading-relaxed py-1" data-placeholder="กดพิมพ์ข้อความ...">${block.content}</div>`;
        }
      }).join('');
    }

    function insertBlock(type) {
      const page = pages.find(p => p.id === currentPageId);
      if (!page) return;
      if (type === 'h1') page.blocks.push({ type: 'h1', content: '' });
      else if (type === 'todo') page.blocks.push({ type: 'todo', content: '', checked: false });
      else if (type === 'callout') page.blocks.push({ type: 'callout', content: '' });
      else if (type === 'toggle') page.blocks.push({ type: 'toggle', summary: 'หัวข้อย่อขยาย...', content: '' });
      else page.blocks.push({ type: 'text', content: '' });
      savePages();
      renderBlocks();
    }

    function updateBlock(index, content) {
      const page = pages.find(p => p.id === currentPageId);
      if (page && page.blocks[index]) { page.blocks[index].content = content; savePages(); }
    }
    function updateToggleSummary(index, summary) {
      const page = pages.find(p => p.id === currentPageId);
      if (page && page.blocks[index]) { page.blocks[index].summary = summary; savePages(); }
    }
    function toggleTodo(index, checked) {
      const page = pages.find(p => p.id === currentPageId);
      if (page && page.blocks[index]) { page.blocks[index].checked = checked; savePages(); renderBlocks(); }
    }

    function deleteCurrentPage() {
      if (pages.length <= 1) return alert('ต้องเหลืออย่างน้อย 1 หน้านะคะ');
      if (confirm('ต้องการลบหน้านี้หรือไม่?')) {
        pages = pages.filter(p => p.id !== currentPageId);
        savePages();
        selectPage(pages[0].id);
      }
    }

    // --- Database View ---
    function setDbView(view) {
      currentDbView = view;
      if (view === 'table') {
        document.getElementById('dbTableView').classList.remove('hidden');
        document.getElementById('dbBoardView').classList.add('hidden');
        document.getElementById('btnViewTable').className = 'px-2.5 py-1 rounded-lg bg-cottagePlum text-white font-medium';
        document.getElementById('btnViewBoard').className = 'px-2.5 py-1 rounded-lg bg-white border border-cottageSlate/20 text-cottageSlate font-medium';
      } else {
        document.getElementById('dbTableView').classList.add('hidden');
        document.getElementById('dbBoardView').classList.remove('hidden');
        document.getElementById('btnViewBoard').className = 'px-2.5 py-1 rounded-lg bg-cottagePlum text-white font-medium';
        document.getElementById('btnViewTable').className = 'px-2.5 py-1 rounded-lg bg-white border border-cottageSlate/20 text-cottageSlate font-medium';
      }
    }

    function renderDatabase() {
      const tableBody = document.getElementById('dbTableBody');
      tableBody.innerHTML = dbItems.map((item, idx) => `
        <tr class="hover:bg-stone-50">
          <td class="p-2"><input type="text" value="${item.title}" onchange="updateDbItem(${idx}, 'title', this.value)" class="w-full bg-transparent outline-none font-medium text-xs"></td>
          <td class="p-2">
            <select onchange="updateDbItem(${idx}, 'status', this.value)" class="bg-stone-100 border border-cottageSlate/20 rounded p-0.5 text-[11px] outline-none">
              <option value="To Do" ${item.status === 'To Do' ? 'selected' : ''}>To Do</option>
              <option value="In Progress" ${item.status === 'In Progress' ? 'selected' : ''}>In Progress</option>
              <option value="Done" ${item.status === 'Done' ? 'selected' : ''}>Done</option>
            </select>
          </td>
          <td class="p-2"><input type="text" value="${item.priority}" onchange="updateDbItem(${idx}, 'priority', this.value)" class="w-full bg-transparent outline-none text-xs"></td>
          <td class="p-2 text-center"><button onclick="deleteDbItem(${idx})" class="text-red-400">✕</button></td>
        </tr>
      `).join('');

      const todos = dbItems.filter(i => i.status === 'To Do');
      const progs = dbItems.filter(i => i.status === 'In Progress');
      const dones = dbItems.filter(i => i.status === 'Done');

      document.getElementById('count-todo').innerText = todos.length;
      document.getElementById('count-progress').innerText = progs.length;
      document.getElementById('count-done').innerText = dones.length;

      const card = item => `
        <div class="bg-white p-2.5 rounded-xl border border-cottageSlate/15 shadow-sm text-xs space-y-1.5">
          <div class="font-medium">${item.title}</div>
          <div class="flex justify-between items-center text-[10px] text-cottageSlate">
            <span>${item.priority}</span>
            <select onchange="updateDbItemById('${item.id}', 'status', this.value)" class="bg-transparent border border-cottageSlate/20 rounded px-1">
              <option value="To Do" ${item.status === 'To Do' ? 'selected' : ''}>To Do</option>
              <option value="In Progress" ${item.status === 'In Progress' ? 'selected' : ''}>In Progress</option>
              <option value="Done" ${item.status === 'Done' ? 'selected' : ''}>Done</option>
            </select>
          </div>
        </div>
      `;
      document.getElementById('board-todo').innerHTML = todos.map(card).join('');
      document.getElementById('board-progress').innerHTML = progs.map(card).join('');
      document.getElementById('board-done').innerHTML = dones.map(card).join('');
    }

    function addNewDbRow() {
      dbItems.push({ id: Date.now().toString(), title: 'งานใหม่', status: 'To Do', priority: 'ทั่วไป 🍃' });
      saveDb();
      renderDatabase();
    }
    function updateDbItem(idx, key, val) { dbItems[idx][key] = val; saveDb(); }
    function updateDbItemById(id, key, val) { const item = dbItems.find(i => i.id === id); if(item){ item[key] = val; saveDb(); renderDatabase(); } }
    function deleteDbItem(idx) { dbItems.splice(idx, 1); saveDb(); renderDatabase(); }

    function exportData() {
      const fullBackup = { folders, pages, dbItems, date: new Date().toISOString() };
      const str = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(fullBackup, null, 2));
      const a = document.createElement('a');
      a.setAttribute("href", str);
      a.setAttribute("download", `cottage_backup.json`);
      document.body.appendChild(a);
      a.click();
      a.remove();
    }

    function importData(e) {
      const reader = new FileReader();
      reader.onload = function(event) {
        try {
          const data = JSON.parse(event.target.result);
          if (data.pages) {
            folders = data.folders || [];
            pages = data.pages;
            dbItems = data.dbItems || [];
            saveFolders(); savePages(); saveDb();
            renderSidebarTree(); selectPage(pages[0].id);
            alert('กู้คืนข้อมูลสำเร็จแล้วค่ะ! 🌸');
          }
        } catch(err) { alert('ไฟล์ไม่ถูกต้องค่ะ'); }
      };
      reader.readAsText(e.target.files[0]);
    }
  </script>
</body>
</html>
