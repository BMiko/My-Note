<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Cottagecore Notes</title>
  
  <!-- ตั้งค่าแอปสำหรับมือถือ -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="My Cottage">
  <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/869/869869.png">

  <!-- นำเข้า Tailwind CSS และฟอนต์สไตล์วินเทจแบบหนังสือโบราณ -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Pridi:wght@300;400;500;600&display=swap" rel="stylesheet">

  <script>
    // ฝังพาเลตต์สีของคุณเข้าไปใน Tailwind
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            cottagePink: '#ef9dc1',
            cottagePlum: '#663366',
            cottagePaper: '#fafafa',
            cottageSlate: '#5b5a58',
            cottageBark: '#1c0e07',
          }
        }
      }
    }
  </script>

  <style>
    body { 
      font-family: 'Pridi', serif; 
      background-color: #fafafa;
    }
    /* ให้ความรู้สึกแบบกระดาษรองเขียน */
    .paper-texture {
      background-image: radial-gradient(#5b5a58 0.5px, transparent 0.5px);
      background-size: 24px 24px;
      opacity: 0.04;
    }
  </style>
</head>
<body class="min-h-screen text-cottageBark relative pb-16">
  <!-- พื้นผิวลายจุดจางๆ เพิ่มความวินเทจ -->
  <div class="fixed inset-0 paper-texture pointer-events-none"></div>

  <!-- ส่วนหัว (Header) -->
  <header class="max-w-md mx-auto pt-10 pb-6 px-6 text-center">
    <div class="inline-block text-2xl mb-1">🌿 📜 ☕</div>
    <h1 class="text-3xl font-semibold text-cottagePlum tracking-wide">ไดอารี่ในบ้านสวน</h1>
    <p class="text-xs text-cottageSlate mt-1 font-light tracking-wider">บันทึกเรื่องราวเล็กๆ ท่ามกลางธรรมชาติ</p>
    <div class="w-16 h-0.5 bg-cottagePink mx-auto mt-4 rounded-full"></div>
  </header>

  <!-- เนื้อหาหลัก -->
  <main class="max-w-md mx-auto px-6 relative z-10">
    
    <!-- กล่องเขียนโน้ตใหม่ (สไตล์ซองจดหมาย/การ์ดวินเทจ) -->
    <div class="bg-white/90 p-6 rounded-2xl shadow-sm border border-cottageSlate/20 mb-8 backdrop-blur-sm">
      <input id="noteTitle" type="text" placeholder="ชื่อบันทึกของวันนี้..." 
             class="w-full text-base font-medium outline-none bg-transparent placeholder-cottageSlate/50 mb-3 text-cottageBark border-b border-cottageSlate/10 pb-1">
      
      <textarea id="noteContent" rows="3" placeholder="เขียนข้อความอบอุ่นของคุณที่นี่..." 
                class="w-full text-sm outline-none bg-transparent placeholder-cottageSlate/50 resize-none leading-relaxed text-cottageBark"></textarea>
      
      <div class="flex justify-between items-center mt-4 pt-3 border-t border-cottageSlate/10">
        <!-- ปุ่มเลือกสีการ์ด (โทนละมุน) -->
        <div class="flex gap-2.5 items-center" id="colorPicker">
          <button onclick="selectColor('bg-[#ffffff] border-cottageSlate/20')" title="กระดาษขาว" class="w-5 h-5 rounded-full bg-[#ffffff] border border-cottageSlate/40 hover:scale-110 transition-transform"></button>
          <button onclick="selectColor('bg-[#fbf0f4] border-cottagePink/40')" title="กลีบกุหลาบ" class="w-5 h-5 rounded-full bg-[#ef9dc1]/30 border border-cottagePink hover:scale-110 transition-transform"></button>
          <button onclick="selectColor('bg-[#f3ebf3] border-cottagePlum/30')" title="ดอกลาเวนเดอร์" class="w-5 h-5 rounded-full bg-[#663366]/20 border border-cottagePlum hover:scale-110 transition-transform"></button>
          <button onclick="selectColor('bg-[#f4f3f0] border-cottageSlate/30')" title="เปลือกไม้แห้ง" class="w-5 h-5 rounded-full bg-[#5b5a58]/20 border border-cottageSlate hover:scale-110 transition-transform"></button>
        </div>

        <!-- ปุ่มบันทึก -->
        <button onclick="addNote()" class="bg-cottagePlum hover:bg-cottagePlum/90 text-cottagePaper text-xs px-5 py-2 rounded-full font-medium shadow-sm transition-all active:scale-95 flex items-center gap-1">
          <span>บันทึก</span> 🌸
        </button>
      </div>
    </div>

    <!-- แถบหัวข้อรายการโน้ต -->
    <div class="flex items-center justify-between mb-4 px-1">
      <span class="text-xs uppercase tracking-widest text-cottageSlate font-semibold">แผ่นบันทึกความทรงจำ</span>
      <span id="noteCount" class="text-xs text-cottagePink font-medium"></span>
    </div>

    <!-- รายการโน้ตทั้งหมด -->
    <div id="notesList" class="space-y-4">
      <!-- โน้ตจะถูกดึงมาแสดงที่นี่ -->
    </div>
  </main>

  <!-- JavaScript -->
  <script>
    let currentColor = 'bg-[#ffffff] border-cottageSlate/20';

    function selectColor(colorClass) {
      currentColor = colorClass;
    }

    window.onload = function() {
      renderNotes();
    };

    function getNotes() {
      return JSON.parse(localStorage.getItem('cottagecore_notes') || '[]');
    }

    function saveNotes(notes) {
      localStorage.setItem('cottagecore_notes', JSON.stringify(notes));
      renderNotes();
    }

    function addNote() {
      const title = document.getElementById('noteTitle').value.trim();
      const content = document.getElementById('noteContent').value.trim();
      
      if (!title && !content) return;

      const notes = getNotes();
      notes.unshift({
        id: Date.now(),
        title: title || 'ความทรงจำที่ไม่มีชื่อ',
        content: content,
        color: currentColor,
        date: new Date().toLocaleDateString('th-TH', { 
          year: 'numeric', 
          month: 'long', 
          day: 'numeric' 
        })
      });

      saveNotes(notes);
      
      document.getElementById('noteTitle').value = '';
      document.getElementById('noteContent').value = '';
    }

    function deleteNote(id) {
      let notes = getNotes();
      notes = notes.filter(n => n.id !== id);
      saveNotes(notes);
    }

    function renderNotes() {
      const list = document.getElementById('notesList');
      const notes = getNotes();
      
      document.getElementById('noteCount').innerText = `${notes.length} รายการ`;

      if (notes.length === 0) {
        list.innerHTML = `
          <div class="text-center py-16 text-cottageSlate border border-dashed border-cottageSlate/30 rounded-2xl p-6">
            <p class="text-2xl mb-2">🧺</p>
            <p class="text-sm font-light">ยังไม่มีเรื่องราวถูกบันทึกไว้เลย...</p>
            <p class="text-xs text-cottagePink mt-1">หยิบปากกาขนนกแล้วเริ่มเขียนกันเถอะ</p>
          </div>
        `;
        return;
      }

      list.innerHTML = notes.map(note => `
        <div class="${note.color} p-5 rounded-2xl shadow-sm border relative group transition-all duration-200 hover:shadow-md">
          <button onclick="deleteNote(${note.id})" class="absolute top-4 right-4 text-cottageSlate/40 hover:text-cottagePink transition-colors text-xs font-semibold px-2 py-1">
            ✕ ลบ
          </button>
          <h3 class="font-medium text-cottageBark pr-10 mb-2 text-base">${note.title}</h3>
          <p class="text-cottageSlate text-sm whitespace-pre-line leading-relaxed font-light">${note.content}</p>
          <div class="mt-4 pt-3 border-t border-black/5 text-[11px] text-cottageSlate/70 flex justify-between items-center">
            <span>📅 ${note.date}</span>
            <span class="text-cottagePink text-xs">❦</span>
          </div>
        </div>
      `).join('');
    }
  </script>
</body>
</html>
